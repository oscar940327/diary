name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DIARY_FRONTEND_REPOSITORY: ${{ github.workspace }}/personal-website

    steps:
      - name: Check out Diary API
        uses: actions/checkout@v6
        with:
          path: diary

      - name: Check out Ticket 07 frontend
        uses: actions/checkout@v6
        with:
          repository: oscar940327/my-personal-website
          ref: 231ebe21ed09ec7d777f3c78ed6eb58aab396962
          path: personal-website
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diary/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            diary/package-lock.json
            personal-website/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
        working-directory: diary

      - name: Install frontend dependencies
        run: npm ci
        working-directory: personal-website

      - name: Install local Supabase tooling
        run: npm ci
        working-directory: diary

      - name: Install browser
        run: python -m playwright install --with-deps chromium
        working-directory: diary

      - name: Type-check
        run: python -m mypy src tests
        working-directory: diary

      - name: Test
        run: python -m pytest
        working-directory: diary
