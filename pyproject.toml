[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-api"
version = "0.1.0"
description = "FastAPI backend for Diary"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "playwright==1.61.0",
    "pytest>=8.4,<9",
    "pytest-playwright==0.8.0",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
